name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[test]'
      - run: pytest -q
      - run: node --check src/seoul_transit/static/bus-map.js
      - run: docker build -t seoul-transit .

