# Open-data discovery + Google Maps links work without provider API keys.
# Optional official provider keys can be added later in Render Environment.
# Public read-only MCP for ChatGPT No authentication; REST API stays token-protected.
services:
  - type: web
    name: seoul-transit-mcp
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ACCESS_TOKEN
        generateValue: true
      - key: MCP_PUBLIC
        value: "true"
      - key: OPEN_DATA_FIRST
        value: "true"
