# Provider keys are optional at deployment. Add them later in Render Environment.
# Missing keys return "unavailable"; this does not enable keyless transit data.
services:
  - type: web
    name: seoul-transit-mcp
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ACCESS_TOKEN
        generateValue: true
      - key: MCP_PUBLIC
        value: "false"
