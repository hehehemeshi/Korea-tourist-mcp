[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "seoul-transit"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = ["fastmcp>=2.14.7,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.11,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.setuptools.package-data]
seoul_transit = ["static/*", "data/*"]
[tool.pytest.ini_options]
pythonpath = ["src"]
